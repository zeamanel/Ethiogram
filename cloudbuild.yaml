# Cloud Build: build → push → deploy API + workers to Cloud Run
# Usage: gcloud builds submit --config cloudbuild.yaml

substitutions:
  _REGION: us-central1
  _REPO: ethiogram
  _SERVICE: ethiogram-api
  _SQL_INSTANCE: ""   # e.g. project:region:ethiogram-pg — set in trigger
  _VPC_CONNECTOR: ethiogram-vpc   # required to reach Memorystore's private IP

steps:
  # ── Build production image ─────────────────────────────────────────────
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --target=production
      - -t=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA
      - -t=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest
      - .

  # ── Push to Artifact Registry ──────────────────────────────────────────
  - id: push
    name: gcr.io/cloud-builders/docker
    args: [push, --all-tags, "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}"]

  # ── Deploy API ─────────────────────────────────────────────────────────
  - id: deploy-api
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --min-instances=1
      - --max-instances=20
      - --cpu=1
      - --memory=1Gi
      - --concurrency=80
      - --timeout=300
      - --add-cloudsql-instances=${_SQL_INSTANCE}
      # Route only RFC1918 (Memorystore 10.x) through the connector; public
      # traffic (Telegram/OpenRouter) stays direct — cheapest + fastest.
      - --vpc-connector=${_VPC_CONNECTOR}
      - --vpc-egress=private-ranges-only
      - --set-env-vars=ENVIRONMENT=production,GCP_PROJECT_ID=$PROJECT_ID,VERTEX_AI_LOCATION=us-central1,OPENAI_BASE_URL=https://openrouter.ai/api/v1,DEFAULT_MODEL_ID=openai/gpt-4o-mini,FALLBACK_MODEL_ID=anthropic/claude-3.5-haiku,EMERGENCY_MODEL_ID=meta-llama/llama-3.1-8b-instruct
      - --set-secrets=SECRET_KEY=ethiogram-secret-key:latest,ENCRYPTION_KEY=ethiogram-encryption-key:latest,DATABASE_URL=ethiogram-database-url:latest,REDIS_URL=ethiogram-redis-url:latest,MASTER_BOT_TOKEN=ethiogram-master-bot-token:latest,OPENAI_API_KEY=ethiogram-openai-key:latest,ANTHROPIC_API_KEY=ethiogram-anthropic-key:latest,CHAPA_SECRET_KEY=ethiogram-chapa-key:latest,WEBHOOK_SECRET_SALT=ethiogram-webhook-salt:latest,ADMIN_SECRET_HEADER=ethiogram-admin-header:latest

  # ── Deploy workers as Cloud Run JOBS (run-to-completion, no HTTP) ───────
  # Jobs do ONE pass and exit; Cloud Scheduler invokes them on a cron (set up
  # once, manually — see scripts/setup_scheduler.sh). They have no $PORT/HTTP
  # health check, which is why the old Service deploys failed.

  - id: deploy-embedding-worker
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - jobs
      - deploy
      - ethiogram-embedding-worker
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA
      - --region=${_REGION}
      - --command=python
      - --args=-m,workers.embedding_worker,once
      - --cpu=1
      - --memory=1Gi
      - --task-timeout=600
      - --max-retries=1
      - --set-cloudsql-instances=${_SQL_INSTANCE}
      - --vpc-connector=${_VPC_CONNECTOR}
      - --vpc-egress=private-ranges-only
      - --set-env-vars=ENVIRONMENT=production,GCP_PROJECT_ID=$PROJECT_ID,VERTEX_AI_LOCATION=us-central1,OPENAI_BASE_URL=https://openrouter.ai/api/v1
      - --set-secrets=SECRET_KEY=ethiogram-secret-key:latest,ENCRYPTION_KEY=ethiogram-encryption-key:latest,DATABASE_URL=ethiogram-database-url:latest,REDIS_URL=ethiogram-redis-url:latest

  - id: deploy-notification-worker
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - jobs
      - deploy
      - ethiogram-notification-worker
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA
      - --region=${_REGION}
      - --command=python
      - --args=-m,workers.notification_worker,once
      - --cpu=1
      - --memory=512Mi
      - --task-timeout=300
      - --max-retries=1
      - --set-cloudsql-instances=${_SQL_INSTANCE}
      - --vpc-connector=${_VPC_CONNECTOR}
      - --vpc-egress=private-ranges-only
      - --set-env-vars=ENVIRONMENT=production,OPENAI_BASE_URL=https://openrouter.ai/api/v1
      - --set-secrets=SECRET_KEY=ethiogram-secret-key:latest,ENCRYPTION_KEY=ethiogram-encryption-key:latest,DATABASE_URL=ethiogram-database-url:latest,REDIS_URL=ethiogram-redis-url:latest,MASTER_BOT_TOKEN=ethiogram-master-bot-token:latest

  - id: deploy-trial-monitor
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - jobs
      - deploy
      - ethiogram-trial-monitor
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA
      - --region=${_REGION}
      - --command=python
      - --args=-m,workers.trial_monitor
      - --cpu=1
      - --memory=512Mi
      - --task-timeout=600
      - --max-retries=1
      - --set-cloudsql-instances=${_SQL_INSTANCE}
      - --vpc-connector=${_VPC_CONNECTOR}
      - --vpc-egress=private-ranges-only
      - --set-env-vars=ENVIRONMENT=production
      - --set-secrets=SECRET_KEY=ethiogram-secret-key:latest,ENCRYPTION_KEY=ethiogram-encryption-key:latest,DATABASE_URL=ethiogram-database-url:latest,REDIS_URL=ethiogram-redis-url:latest

  - id: deploy-escrow-release
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - jobs
      - deploy
      - ethiogram-escrow-release
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA
      - --region=${_REGION}
      - --command=python
      - --args=-m,workers.escrow_release
      - --cpu=1
      - --memory=512Mi
      - --task-timeout=600
      - --max-retries=1
      - --set-cloudsql-instances=${_SQL_INSTANCE}
      - --vpc-connector=${_VPC_CONNECTOR}
      - --vpc-egress=private-ranges-only
      - --set-env-vars=ENVIRONMENT=production
      - --set-secrets=SECRET_KEY=ethiogram-secret-key:latest,ENCRYPTION_KEY=ethiogram-encryption-key:latest,DATABASE_URL=ethiogram-database-url:latest,REDIS_URL=ethiogram-redis-url:latest

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
