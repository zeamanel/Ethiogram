# Cloud Build: build → push → deploy API + workers to Cloud Run
# Usage: gcloud builds submit --config cloudbuild.yaml

substitutions:
  _REGION: us-central1
  _REPO: ethiogram
  _SERVICE: ethiogram-api
  _SQL_INSTANCE: ""   # e.g. project:region:ethiogram-pg — set in trigger

steps:
  # ── Build production image ─────────────────────────────────────────────
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --target=production
      - -t=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA
      - -t=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest
      - .

  # ── Push to Artifact Registry ──────────────────────────────────────────
  - id: push
    name: gcr.io/cloud-builders/docker
    args: [push, --all-tags, "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}"]

  # ── Deploy API ─────────────────────────────────────────────────────────
  - id: deploy-api
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --min-instances=1
      - --max-instances=20
      - --cpu=1
      - --memory=1Gi
      - --concurrency=80
      - --timeout=300
      - --add-cloudsql-instances=${_SQL_INSTANCE}
      - --set-env-vars=ENVIRONMENT=production
      - --set-secrets=SECRET_KEY=ethiogram-secret-key:latest,ENCRYPTION_KEY=ethiogram-encryption-key:latest,DATABASE_URL=ethiogram-database-url:latest,REDIS_URL=ethiogram-redis-url:latest,MASTER_BOT_TOKEN=ethiogram-master-bot-token:latest,OPENAI_API_KEY=ethiogram-openai-key:latest,ANTHROPIC_API_KEY=ethiogram-anthropic-key:latest,CHAPA_SECRET_KEY=ethiogram-chapa-key:latest,WEBHOOK_SECRET_SALT=ethiogram-webhook-salt:latest,ADMIN_SECRET_HEADER=ethiogram-admin-header:latest

  # ── Deploy embedding worker (same image, worker command) ──────────────
  - id: deploy-embedding-worker
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ethiogram-embedding-worker
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --no-allow-unauthenticated
      - --min-instances=1
      - --max-instances=2
      - --cpu=1
      - --memory=1Gi
      - --no-cpu-throttling
      - --command=python
      - --args=-m,workers.embedding_worker,continuous
      - --add-cloudsql-instances=${_SQL_INSTANCE}
      - --set-env-vars=ENVIRONMENT=production
      - --set-secrets=SECRET_KEY=ethiogram-secret-key:latest,ENCRYPTION_KEY=ethiogram-encryption-key:latest,DATABASE_URL=ethiogram-database-url:latest,REDIS_URL=ethiogram-redis-url:latest

  # ── Deploy notification worker ─────────────────────────────────────────
  - id: deploy-notification-worker
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ethiogram-notification-worker
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --no-allow-unauthenticated
      - --min-instances=1
      - --max-instances=2
      - --cpu=1
      - --memory=512Mi
      - --no-cpu-throttling
      - --command=python
      - --args=-m,workers.notification_worker,continuous
      - --add-cloudsql-instances=${_SQL_INSTANCE}
      - --set-env-vars=ENVIRONMENT=production
      - --set-secrets=SECRET_KEY=ethiogram-secret-key:latest,ENCRYPTION_KEY=ethiogram-encryption-key:latest,DATABASE_URL=ethiogram-database-url:latest,REDIS_URL=ethiogram-redis-url:latest,MASTER_BOT_TOKEN=ethiogram-master-bot-token:latest

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
