<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Store · Ethiogram</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Sora:wght@600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,700&family=DM+Sans:wght@400;500;600&family=Inter:wght@400;500;600&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

  <!-- LOADING -->
  <div id="loading" class="center-state">
    <div class="spinner"></div>
    <div class="cs-text">Loading store…</div>
  </div>

  <!-- ERROR / NOT FOUND -->
  <div id="error" class="center-state hidden">
    <div class="cs-emoji">🏪</div>
    <div class="cs-title" id="error-title">Store not found</div>
    <div class="cs-text" id="error-msg">This storefront isn't available.</div>
  </div>

  <!-- STORE -->
  <div id="store" class="hidden">
    <div class="s-header">
      <div class="s-logo" id="s-logo"></div>
      <div class="s-hinfo">
        <div class="s-hname" id="s-hname"></div>
        <div class="s-hsub" id="s-hsub"></div>
      </div>
    </div>
    <!-- sections render here, in payload order -->
    <div id="sections"></div>
  </div>

  <!-- CART BAR (shown when cart has items) -->
  <div id="cart-bar" class="cart-bar hidden">
    <div class="cart-info">
      <div class="cart-count" id="cart-count"></div>
      <div class="cart-total" id="cart-total"></div>
    </div>
    <button class="cart-btn" id="cart-btn">Order on Telegram →</button>
  </div>

  <script src="store.js"></script>
</body>
</html>
